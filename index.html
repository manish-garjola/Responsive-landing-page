<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <div class="image1"></div>
  <div class="image2"></div>
  <div class="container">
    <div class="poa">
    <h2>PERFUME</h2>
    <h1 class="boldheading">Gabrielle Essence Eau De Perfume</h1>
    <p class="bio">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
    Perfumer-Creator for the House of CHANEL.</p>
    <div class="price">
     <p class="pricereal">$149.99</p>
     <p class="pricetemp">$169.99</p>
    </div>
    <button type="submit" class="addtocart"><img src="./images/icon-cart.svg" class="po">Add to Cart</button>
  </div>
</div>
</body>
</html>
